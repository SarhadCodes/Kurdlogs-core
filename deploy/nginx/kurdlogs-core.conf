upstream kurdlogs_panel_gateway {
    server 127.0.0.1:8081;
    keepalive 32;
}

# app.kurdlogs.com — panel shell only. API, sockets, uploads, and stream files
# use their dedicated hostnames from runtime-config.js.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.kurdlogs.com;

    ssl_certificate /etc/letsencrypt/live/kurdlogs-core/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kurdlogs-core/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KurdLogsSSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/kurdlogs-cloudflare-only.conf;

    access_log /var/log/nginx/kurdlogs-app.access.log;
    error_log /var/log/nginx/kurdlogs-app.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /api { return 404; }
    location ^~ /socket.io { return 404; }
    location ^~ /stream/ { return 404; }
    location ^~ /uploads/ { return 404; }

    location / {
        proxy_pass http://kurdlogs_panel_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}

# api.kurdlogs.com — DNS-only initially so uploads up to 4 GB do not hit the
# Cloudflare Free 100 MB request-body limit.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kurdlogs.com;

    ssl_certificate /etc/letsencrypt/live/kurdlogs-core/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kurdlogs-core/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KurdLogsSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4g;
    access_log /var/log/nginx/kurdlogs-api.access.log;
    error_log /var/log/nginx/kurdlogs-api.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /api {
        proxy_pass http://kurdlogs_panel_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        send_timeout 7200s;
    }

    location ^~ /uploads/ {
        proxy_pass http://kurdlogs_panel_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Authenticated panel previews use the API host's secure session cookie.
    location ^~ /stream/ {
        proxy_pass http://kurdlogs_panel_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /socket.io {
        proxy_pass http://kurdlogs_panel_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / { return 404; }
}

# cdn.kurdlogs.com — HLS/DASH delivery only. /live is internally mapped to
# the existing protected /stream route so tokens are still checked by Express.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.kurdlogs.com;

    ssl_certificate /etc/letsencrypt/live/kurdlogs-core/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kurdlogs-core/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KurdLogsSSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/kurdlogs-cloudflare-only.conf;

    access_log /var/log/nginx/kurdlogs-cdn.access.log;
    error_log /var/log/nginx/kurdlogs-cdn.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /live/ {
        limit_except GET HEAD OPTIONS { deny all; }
        rewrite ^/live/(.*)$ /stream/$1 break;
        proxy_pass http://kurdlogs_panel_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}
